# Recoll index over the review checkouts. recollindex runs in the
# background from review start (podman_repos.start_recoll_index kicks
# it off after provisioning; the recollq wrapper next to this file
# blocks on its completion). The shell runs as root, so /root/.recoll
# is the default confdir and plain ``recollq <query>`` works.
topdirs = /work
skippedNames+ = .git
noaspell = 1
idxflushmb = 256
# suffix-less and odd-suffix sources (Makefile, configure, *.texi,
# *.mak, *.S ...) would otherwise be skipped: type them with file(1)
# (xdg-mime is not installed) and index every text/* as plain text
systemfilecommand = file -b --mime-type
textunknownasplain = 1

# Issues/PRs exist as both .md and .json renderings of the same data;
# the .md is the form the prompt points models at, skip the duplicate.
[/work/all_ffmpeg/forgejo_git]
skippedNames+ = *.json

[/work/forgejo_git]
skippedNames+ = *.json
